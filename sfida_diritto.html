html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font:17px/1.5 "Trebuchet MS",Verdana,sans-serif;color:#fff;background:#4f46e5 linear-gradient(160deg,#4f46e5,#9333ea 55%,#ec4899) fixed}

h1{margin:6px 0;font-size:2rem;text-align:center}

.card{background:var(--card);color:var(--ink);border-radius:20px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card h2{font-size:1.1rem;margin:8px 0 12px}

.opt.no{background:#fecaca;border-color:#dc2626;color:#7f1d1d}
.res{font-weight:700;font-size:1.1rem;margin:12px 0 4px}.res.g{color:#16a34a}.res.r{color:#dc2626}
.ex{margin:4px 0 8px;font-size:.95rem}
.lb{list-style:none;padding:0}
.lb li{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;margin:8px 0}

.lb span{width:2.2em;text-align:center;font-weight:700}
.big-s{font-size:3rem;font-weight:700;text-align:center;color:#fde047;line-height:1.1}
.rules li{margin:6px 0}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:99;animation:cf 2.6s linear forwards;pointer-events:none}

#bgs{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg{position:absolute;inset:0;opacity:0;transition:opacity 1s}
.bg.on{opacity:1}
.bg span{position:absolute;font-size:3.2rem;opacity:.16;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-28px) rotate(12deg)}}
.avs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.av{font-size:1.6rem;width:3rem;height:3rem;border-radius:50%;border:3px solid rgba(255,255,255,.5);background:rgba(255,255,255,.15);cursor:pointer}
.av.on{border-color:#fde047;background:#fde047;transform:scale(1.12)}

.bdg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:10px 0}
.bgc{background:rgba(255,255,255,.2);border-radius:16px;padding:10px;text-align:center}
.bgc span{font-size:2rem;display:block}
.bgc small{display:block;opacity:.85;font-size:.78rem}
.bgc.lk{opacity:.55}

function bg(k){const T=TP[k]||TP.home,d=document.createElement('div');d.className='bg';d.style.background='linear-gradient(160deg,'+T[0]+','+T[1]+')';let h='';for(let i=0;i<9;i++)h+='<span style="left:'+Math.random()*90+'%;top:'+Math.random()*90+'%;animation-delay:-'+Math.random()*8+'s">'+T[2]+'</span>';d.innerHTML=h;$('#bgs').appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('on')));setTimeout(()=>{const a=document.querySelectorAll('#bgs .bg');for(let i=0;i<a.length-1;i++)a[i].remove()},1200)}
function home(){bg('home');app.innerHTML='<div class="logo">⚖️</div><h1>Sfida Diritto</h1><p class="sub">10 domande, 3 vite: più sei veloce e più punti fai!</p><div class="avs">'+AV.map(a=>'<button class="av'+(a==av?' on':'')+'" data-v="'+a+'">'+a+'</button>').join('')+'</div><input id="nm" maxlength="14" placeholder="Il tuo nome" value="'+E(name)+'"><button class="btn big" data-a="play">▶ Gioca</button><button class="btn" data-a="lb">🏆 Classifica</button><button class="btn" data-a="bdg">🎖 Badge</button><button class="btn" data-a="duo">👥 Sfida a due</button><button class="btn ghost" data-a="how">❓ Come si gioca</button>'}
function how(){bg('home');app.innerHTML='<h1>❓ Come si gioca</h1><ul class="rules"><li>Ogni partita ha <b>10 domande</b>: 3 vero/falso, 4 base, 3 difficili.</li><li>Hai <b>3 vite ❤️</b>: sbagli o scade il tempo e ne perdi una.</li><li>Punti base: vero/falso <b>50</b>, base <b>100</b>, difficile <b>200</b>.</li><li><b>Bonus velocità</b>: fino a +50% se rispondi presto.</li><li><b>Combo 🔥</b>: ogni risposta giusta di fila dà +10% (fino a +50%).</li><li>L\'ultima domanda vale <b>doppio ⭐</b>.</li><li>Arrivi in fondo? <b>+100 punti</b> per ogni vita rimasta.</li><li>🎖 <b>Badge</b>: si sbloccano con imprese speciali (zero errori, combo, velocità...). Li vedi dal pulsante Badge.</li><li>👥 <b>Sfida a due</b>: un telefono, 5 domande a testa a turni. Vince chi fa più punti (non entra in classifica).</li><li>La classifica è salvata su questo dispositivo: passa il telefono agli amici e sfidatevi!</li></ul><button class="btn big" data-a="play">▶ Gioca</button><button class="btn" data-a="home">🏠 Home</button>'}
function start(){name=(($('#nm')||{}).value||'').trim()||name||'Giocatore';sv();
const by=k=>sh(D.filter(q=>q[4]==k));
const qs=[...by('v').slice(0,3),...by('b').slice(0,4),...by('d').slice(0,3)].map(q=>{const vf=q[4]=='v',ix=sh(q[1].map((o,i)=>i));return{t:q[0],o:vf?q[1]:ix.map(i=>q[1][i]),a:vf?q[2]:ix.indexOf(q[2]),s:q[3],k:q[4],p:q[5]}});
st={qs,i:0,sc:0,lv:3,sk:0,ok:0,n:10};show()}
function show(){const q=st.qs[st.i],T={v:15,b:20,d:25}[q.k];st.T=T;st.t=T;st.done=0;bg(q.p);
app.innerHTML='<div class="hud"><span>'+E(st.duo?du.p[du.cur].a:av)+'</span><span id="hh">'+hearts(st.lv)+'</span><span>Domanda '+(st.i+1)+'/'+st.n+'</span><b>'+st.sc+'</b></div><div class="tb"><i id="tb"></i></div><div class="card"><span class="tag '+q.k+'">'+{v:'Vero o falso',b:'Base',d:'Difficile'}[q.k]+'</span> <span class="tag" style="background:rgba(0,0,0,.35)">'+TP[q.p][2]+' '+TP[q.p][3]+'</span>'+(st.i==st.n-1?' <span class="tag" style="background:#c026d3">PUNTI DOPPI ⭐</span>':'')+(st.sk>1?' <span class="tag" style="background:#e11d48">🔥 combo x'+st.sk+'</span>':'')+'<h2>'+E(q.t)+'</h2>'+q.o.map((o,i)=>'<button class="opt" data-i="'+i+'">'+E(o)+'</button>').join('')+'<div id="fb"></div></div>';
clearInterval(st.h);st.h=setInterval(()=>{st.t-=.1;const r=Math.max(st.t/st.T,0);$('#tb').style.width=r*100+'%';$('#tb').style.background=r<.3?'#f87171':r<.6?'#fbbf24':'#4ade80';if(st.t<=0)ans(-1)},100)}
function ans(i){if(st.done)return;st.done=1;clearInterval(st.h);const q=st.qs[st.i],ok=i==q.a;let p=0;
if(ok){const b={v:50,b:100,d:200}[q.k],sp=Math.floor(b*.5*Math.max(st.t,0)/st.T),m=1+.1*Math.min(st.sk,5);p=Math.round((b+sp)*m*(st.i==st.n-1?2:1));st.sk++;st.ok++;st.sc+=p;st.ms=Math.max(st.ms||0,st.sk);if(st.t>=st.T*.7)st.fa=(st.fa||0)+1;if(q.k=='d')st.hd=(st.hd||0)+1}else{st.sk=0;st.lv--;try{navigator.vibrate(200)}catch(e){}}
app.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;if(k==q.a)b.classList.add('ok');else if(k==i)b.classList.add('no')});
const last=st.lv<=0||st.i==st.n-1;
$('#fb').innerHTML='<p class="res '+(ok?'g':'r')+'">'+(ok?'✅ Giusto! +'+p+' punti':i<0?'⏰ Tempo scaduto!':'❌ Sbagliato')+'</p><p class="ex">'+E(q.s)+'</p><button class="btn big" data-a="nx">'+(last?'🏁 Vedi il risultato':'Avanti ➜')+'</button>';
$('.hud b').textContent=st.sc;$('#hh').textContent=hearts(st.lv)}
function nx(){if(st.lv<=0||st.i==st.n-1)(st.duo?duoEnd():end());else{st.i++;show()}}
function end(){bg('home');const win=st.lv>0,bonus=win?st.lv*100:0;st.sc+=bonus;const ids=['prima'];if(st.ok==10)ids.push('zero');if((st.ms||0)>=5)ids.push('combo');if((st.fa||0)>=5)ids.push('vento');if(win&&st.lv==1)ids.push('sop');if((st.hd||0)>=3)ids.push('diff');if(st.sc>=1000)ids.push('mille');if(st.sc>=1700)ids.push('boss');st.nb=unl(ids);
const r=[[1700,'Imprenditore di successo 👑'],[1200,'Institore 💼'],[800,'Procuratore 📋'],[400,'Commesso 🛒'],[0,'Tirocinante 📚']].find(x=>st.sc>=x[0])[1];
const prev=lb.reduce((m,x)=>Math.max(m,x.s),0),rec=st.sc>prev&&st.sc>0,me={n:name,a:av,s:st.sc,c:st.ok,t:Date.now()};
lb.push(me);lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,10);sv();const pos=lb.indexOf(me)+1;st.me=me;
app.innerHTML='<h1>'+(win?'🎉 Partita finita!':'💥 Vite finite!')+'</h1><div class="big-s">'+st.sc+'</div><p class="sub">punti'+(bonus?' (di cui +'+bonus+' bonus vite)':'')+'</p><p class="sub"><b>'+r+'</b><br>'+st.ok+' risposte giuste su 10</p><p class="sub">'+(rec?'🏅 Nuovo record!':pos?'Sei al <b>'+pos+'° posto</b> in classifica.':'Non sei entrato nella top 10: riprova!')+'</p>'+nbh()+'<button class="btn big" data-a="play">🔁 Rigioca</button><button class="btn" data-a="lb">🏆 Classifica</button><button class="btn ghost" data-a="home">🏠 Home</button>';
if(rec||st.nb.length||(win&&st.ok>=8))conf()}
function board(){bg('home');rsC=0;const me=st.me;app.innerHTML='<h1>🏆 Classifica</h1>'+(lb.length?'<ol class="lb">'+lb.map((x,i)=>'<li class="'+(x===me||(me&&x.t==me.t)?'me':'')+'"><span>'+(['🥇','🥈','🥉'][i]||(i+1)+'°')+'</span><b>'+E(x.a||'🙂')+' '+E(x.n)+'</b><em>'+x.c+'/10</em><strong>'+x.s+'</strong></li>').join('')+'</ol>':'<p class="sub">Ancora nessuna partita: gioca per entrare in classifica!</p>')+'<button class="btn big" data-a="play">▶ Gioca</button><button class="btn" data-a="home">🏠 Home</button>'+(lb.length?'<button class="btn ghost" data-a="rs">🗑 Azzera classifica</button>':'')}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
if(b.dataset.i!==undefined)ans(+b.dataset.i);
else if(b.dataset.v){av=b.dataset.v;app.querySelectorAll('.av').forEach(x=>x.classList.toggle('on',x===b));sv()}
else if(a=='bdg')badges();else if(a=='duo')duoSetup();else if(a=='duogo')duoGo();else if(a=='duostart')duoStart();else if(a=='duonext')duoTurn();else if(a=='rematch'){du.sc=[0,0];du.ok=[0,0];du.cur=0;du.used=[];duoTurn()}else if(a=='play')start();else if(a=='nx')nx();else if(a=='lb')board();else if(a=='how')how();else if(a=='home')home();
else if(a=='rs'){if(!rsC){rsC=1;b.textContent='Sicuro? Tocca ancora'}else{lb=[];st.me=null;sv();board()}}});
home();
</script></body></html>
